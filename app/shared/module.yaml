product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

apply:
  - //android.module-template.yaml

dependencies:
  - //core
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi

dependencies@android:
  - $compose.uiTooling

settings:
  compose:
    enabled: true
    resources:
      packageName: com.kotlintoolchain.aldikitta.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
