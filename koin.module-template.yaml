dependencies:
  - $libs.koin.core
  - $libs.koin.compose
  - $libs.koin.compose.viewmodel.navigation
  - $libs.koin.annotations

settings:
  kotlin:
    ksp:
      processors:
        - $libs.koin.ksp.compiler
      processorOptions:
        KOIN_USE_COMPOSE_VIEWMODEL: "true"
        KOIN_CONFIG_CHECK: "true"
        KOIN_DEFAULT_MODULE: "true"
        koin.generate: all